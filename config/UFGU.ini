; Universal Frame Generation & Upscaling
; Public release defaults
;
; Open the in-game menu with PageDown. The release configuration starts with
; upscaling and frame generation disabled so it is safe on every GPU. Select a
; supported provider and mode in the menu, then restart when the menu asks.


[FrameGeneration]

; 1 enables frame generation; 0 leaves it disabled.
; AMD and Intel frame generation also need an upscaling mode other than Off,
; because Skyrim's motion vectors and depth are only prepared for them while the
; upscaler runs. The menu says so when it refuses to install. NVIDIA DLSS-G does
; not have this requirement and works with upscaling set to Off.
Enabled=0

; Final displayed frames per rendered game frame: 2, 3, 4 or 6. The menu only
; enables multipliers reported by the selected runtime and hardware.
; AMD frame generation is 2 on every GPU, because FidelityFX produces a single
; interpolated frame; a higher value here is accepted and then reported in the log
; as producing one. Intel and NVIDIA report their own ceiling at runtime and the
; menu offers only what they allow.
Multiplier=2

; Fixed or Dynamic. Dynamic is an NVIDIA-only runtime-controlled mode and must
; only be selected when the in-game capability report offers it.
MultiplierMode=Fixed

; Limits Skyrim's real rendered FPS for stable Fixed Frame Generation pacing.
; Use a rate the game can maintain in its heaviest areas. 0 disables the cap.
; Dynamic MFG bypasses this cap automatically while its runtime cadence is
; active.
BaseFrameLimit=0

; Off selects NVIDIA DLSS-G. Intel and AMD select their vendor frame generator.
; Changing this setting requires a restart because the generator owns the
; presentation swap chain for the whole session.
; This is the setting to use if your card cannot run DLSS-G. Neither vendor
; generator is restricted to that vendor's hardware by this plugin: AMD's runs on
; any supported Direct3D 12 GPU, including NVIDIA cards without DLSS-G, and
; Intel's is offered on the same terms but may refuse on non-Intel hardware, in
; which case the log names the device as unsupported. With this left at Off and no
; DLSS-G on the card, the in-game menu correctly shows frame generation as
; unavailable, because Off means DLSS-G and DLSS-G is not there.
VendorFrameGeneration=Off


[Upscaling]

; NVIDIA, AMD or Intel. The active runtime is validated before it is used.
Provider=NVIDIA

; Off, DLAA, Quality, Balanced, Performance or UltraPerformance.
; Provider or mode changes require a restart when requested by the menu.
Mode=Off

; Additional sharpening from 0.00 to 1.00.
Sharpness=0.00

; NVIDIA DLSS image preset: Recommended, E, J, K, L or M.
Preset=Recommended


; ---------------------------------------------------------------------------
; Advanced diagnostics. Keep these values unless a troubleshooting procedure
; explicitly asks for a change.
; ---------------------------------------------------------------------------

; Off or Auto.  Auto applies the sampler mip bias both AMD and Intel document,
; log2(render/display) minus one, so textures are sampled at the mip the
; reconstructed output needs rather than the one the smaller render target
; needs.  Without it an upscaled image is softer than the runtime intends.
; This currently requires [Experimental] Enabled=1 as well, because it is not
; finished.  It has its own key so it can be turned off on its own if distant
; textures shimmer while you move.
; Only samplers with a full mip chain, no bias the engine already set, and
; anisotropic or trilinear filtering are touched.  Shadow comparison samplers
; and single mip UI samplers are left exactly as Skyrim created them.  The
; effect is not retroactive: samplers created before the plugin loaded keep
; their original bias, so it grows as the game creates new ones.
MipBias=Off

; Standard, NoHints, RawMotion or RawMotionNoHints.
TemporalInputs=Standard

; Standard, NearFade or Off.
; How far apart two pixels must be in linear depth before DLSS-G treats them as
; separate surfaces rather than one. Tenths, so 400 is Streamline's 40.0
; default and 20 is 2.0. NVIDIA documents that a SMALLER value is needed when
; the depth range is compressed close to 1.0, which Skyrim's near of 15 makes
; true: at the default, anything within roughly 600 game units counts as one
; surface, which covers every leaf against its own branch.
DepthObjectSeparationTenths=400

MotionDilation=Standard

; Halton or Off.
Jitter=Halton

; CompleteFrame or SubRect. Requires a restart.
SurfaceModel=CompleteFrame

; NopGate or Engine. NopGate prevents Skyrim's own temporal jitter fold from
; running before UFGU evaluates the frame. Requires a restart, because the
; jitter contract is resolved against the camera setup once at startup.
JitterFold=NopGate

; Requested or Measured.
JitterSource=Requested

; NonLinearSRGB or Linear.  This must match what the surface model actually hands
; the upscaler.  CompleteFrame, the default, presents display-ready colour after
; tonemapping, which is NonLinearSRGB.  SubRect hands over the scene before
; tonemapping, which is linear, so set this to Linear if you set SurfaceModel to
; SubRect.  The key keeps its original name, but it now reaches both AMD and
; Intel upscaling, because it describes one fact about the colour the upscaler is
; handed rather than anything vendor specific.  On AMD it selects the non-linear
; sRGB dispatch flag.  On Intel it selects XESS_INIT_FLAG_LDR_INPUT_COLOR, and
; Intel documents that flag as disabling XeSS's own tonemapping: their SR guide
; recommends giving XeSS linear HDR scene colour and says quality may decrease
; when LDR colour is provided, so Linear is the better setting there whenever the
; surface model can supply it.  NVIDIA super-resolution switches between the two
; on its own.  Neither frame generator is told anything about colour space at
; all: both AMD and Intel create their frame generation context without an HDR
; flag, so under SubRect they treat linear scene colour as display-ready and no
; setting changes that.
; Exposure follows this key as well: with Linear the scene
; colour has not been exposed yet, so AMD auto-exposure and Intel auto-exposure
; are both enabled, which is what each vendor documents as the alternative to
; handing them an exposure texture.  With NonLinearSRGB the colour has already
; been tonemapped and exposed, so both are left off and exposing it twice is
; avoided.  The log states which was chosen on each provider.
FsrColorSpace=NonLinearSRGB

; Measured, StandardFinite, StandardInfinite, InvertedFinite or
; InvertedInfinite.  AMD providers only.
FsrDepth=Measured

; Measured, Standard or Inverted.  What NVIDIA frame generation is told about
; the depth range.  Measured reads it from Skyrim's own projection matrix and
; is correct on every configuration seen so far; the overrides exist so a wrong
; measurement can be tested rather than argued about.  It is read every frame,
; so a change takes effect on the next frame after the file is saved and can be
; judged without restarting.  Frame generation history is not reset when it
; changes, so expect a blended frame at the moment of the change.
; This override reaches NVIDIA frame generation only. AMD and Intel frame
; generation read the measured convention directly, so setting this will not
; change what they do.
DepthInverted=Measured

; 1.00 is normal.  Scales the motion vectors handed to the upscaler and to
; frame generation.  Skyrim's field is already normalised, so 1.00 passes it
; through unchanged; lower values visibly degrade interpolation and 0.00
; disables it entirely, which is useful only as a check that the setting is
; being read at all.
; This reaches NVIDIA and AMD only.  Intel upscaling and Intel frame generation
; are given the render extent directly and ignore this scale, so 0.00 changes
; nothing on Intel and is not a valid way to test whether the setting is read.
MotionScaleX=1.00
MotionScaleY=1.00


[Display]

; 0 prevents mid-refresh presentation. 1 permits tearing for lower latency.
; This only has an effect when the game is already presenting without V-Sync.
; Under a fixed multiplier with V-Sync on, the present interval is not zero and
; tearing is never permitted no matter what this is set to.
AllowTearing=0

; Number of swap chain back buffers. 0 keeps the ordinary count, which is what
; ships and what every previous build used. Any value from 3 to 16 overrides it.
; Why this exists: Streamline raises its own frame latency target to match the
; multiplier, and at 6x it was measured asking for 6 while our swap chain held
; only 3 buffers. At 2x it asks for 2, which fits, and 2x is stable. If a
; present blocks waiting for a free buffer then that mismatch is the cause, and
; multiplier plus one is the value to try: 7 for 6x, 5 for 4x.
; This is separate from the experimental gate on purpose so it can be tested
; without also turning on sampler mip bias.
BackBufferCount=0


[Reflex]

; This section is the in-game menu's Low Latency row. The section keeps its
; original name so existing configurations continue to load.

; Off, On or Boost. This selects whichever low latency runtime the card has:
; NVIDIA Reflex, AMD Radeon Anti-Lag 2, or Intel XeLL. Boost is a Reflex
; feature and the other two treat it as On, which is what the menu row shows.
; The row reads Unavailable when no runtime was found and names the reason.
; Anti-Lag 2 needs the AMD driver extension, and XeLL is only created when
; Intel frame generation is running.
Mode=Off

; Final displayed FPS, after generated frames. This is not BaseFrameLimit.
; Every card applies this through its low latency runtime, so one has to be
; present for it to take effect.
; 0 does not mean the same thing on every path. On the NVIDIA presentation
; path 0 paces to the reported display refresh rate rather than removing
; pacing, and only when a refresh rate is reported at all; if none is, 0
; leaves that path unpaced too. The log says which happened, in a line
; beginning "Display refresh reported as". Do not read the swap chain or
; Skyrim display diagnostics for this: both show 0 in borderless windowed
; mode by design and neither is what pacing uses. On the AMD and Intel frame
; generation paths nothing derives a rate from the display, so 0 leaves
; presentation unpaced.
FrameLimit=0


[Overlay]

; How the settings menu presents itself. Full is the panel. Bar collapses it
; to a strip across the top of the screen with the current section open
; beneath it, so the game stays visible while settings are changed. Space
; toggles between them while the menu is open, and the choice is remembered.
MenuPresentation=Full

; Soft tones for menu navigation, synthesised at run time rather than shipped
; as audio files. Every tone is constrained at compile time to a calm range,
; so no build can introduce a piercing or loud one. 0 silences the menu.
MenuSounds=1

; How loud those tones are, from 0.00 to 1.00.
MenuSoundVolume=0.60

; The overlay also exposes provider status and the settings menu.
Enabled=1

; Both, Output or Rendered.
FpsDisplay=Both


[Input]

; PageDown, PageUp, Home, End, Insert, Delete, F1-F12, or one letter/number.
; Grave, Backslash, Minus and Equals are accepted as well. Grave is Skyrim's
; console key by default, so binding it here will collide with the console.
MenuKey=PageDown


[Debug]

; 0 Off, 1 Motion, 2 Depth, 3 Scene, 4 Violations, 5 Motion (generator),
; 6 Depth (generator), 7 UI layer. These match the names the in-game menu
; shows for the same views.
; This is the startup value only. Once the game is running the in-game menu
; owns the debug view, so editing this key mid-session has no effect.
View=0

; 1 enables the Direct3D 12 debug layer and writes what it reports into
; UFGU.log. Requires the Graphics Tools optional Windows feature; if it is not
; installed this setting is ignored and a line saying so is logged. Costs
; performance, so leave it at 0 unless a crash or a frame generation fault is
; being investigated. Read once at startup, so it needs a restart.
D3D12DebugLayer=0


[Experimental]


; Diagnostic. Shows ONLY the frames DLSS-G generates, hiding every real
; frame. NVIDIA documents that real frames are always presented while
; interpolated ones may be dropped when presentation runs ahead of the
; display, so a mixed stream hides how good or bad the generated frames
; actually are. Turn this on to judge them directly. Expect a halved and
; uneven frame rate while it is on; that is the point, not a fault.
ShowOnlyInterpolatedFrames=0
; 1 enables unfinished work in progress features. 0 is the shipped value and
; every experimental feature is inert while it is 0, so a normal installation
; behaves exactly as if this section did not exist.
; These features are not finished, are not supported, and may change or be
; removed without notice. Turn this on only if you were asked to test something
; specific, and expect the log to be noisier than usual.
Enabled=0
