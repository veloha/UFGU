name: Feature request
description: Propose a focused UFGU improvement.
title: "[Feature]: "
labels:
  - enhancement
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: Explain the user or developer problem before proposing an implementation.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
      description: Describe the expected result and affected provider or runtime.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Describe existing settings or workarounds you tried.
  - type: textarea
    id: evidence
    attributes:
      label: Technical references
      description: Link official documentation or public source where relevant. Do not attach restricted material.
  - type: checkboxes
    id: scope
    attributes:
      label: Scope acknowledgement
      options:
        - label: I searched existing issues and requests.
          required: true
        - label: I understand a request is not a compatibility or delivery promise.
          required: true
